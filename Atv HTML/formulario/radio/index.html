<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Buttons</title>
</head>
<body>

    <form id="meuForm">

        <p>Escolha uma linguagem de programação:</p>

        <input type="radio" value="JavaScript" name="linguagem">
        <label>JavaScript</label><br>

        <input type="radio" value="Java" name="linguagem">
        <label>Java</label><br>

        <input type="radio" value="Python" name="linguagem">
        <label>Python</label><br><br>

        <button type="submit">Enviar</button>

    </form>

    <script src="script.js"></script>

</body>
</html>

<body>

    <div class="card">

        <h2>Tipo de Pessoa</h2>

        <form>

            <input
            type="radio"
            name="tipo"
            id="pf">

            <label for="pf">
                Pessoa Física
            </label>

            <br><br>

            <input
            type="radio"
            name="tipo"
            id="pj">

            </label>

            <br><br>

            <input
            type="text"
            id="documento"
            placeholder="CPF">

            <br><br>

            <button type="submit">
                Enviar
            </button>

        </form>

    </div>

    <script src="05.js"></script>

</body>

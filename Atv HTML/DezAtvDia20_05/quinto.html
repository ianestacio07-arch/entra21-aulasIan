<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Verificador de Triângulo</title>
</head>

<body>

    <h1>Verificador de Triângulo</h1>

    <label for="lado1">Lado 1</label>
    <input id="lado1" type="number">

    <br><br>

    <label for="lado2">Lado 2</label>
    <input id="lado2" type="number">

    <br><br>

    <label for="lado3">Lado 3</label>
    <input id="lado3" type="number">

    <br><br>

    <button onclick="verificarTriangulo()">Verificar</button>

    <script>

        function verificarTriangulo() {

            let a = Number(document.getElementById("lado1").value);

            let b = Number(document.getElementById("lado2").value);

            let c = Number(document.getElementById("lado3").value);

            if (a + b > c && a + c > b && b + c > a) {

                if (a == b && b == c) {

                    alert("Triângulo Equilátero");

                } else if (a == b || a == c || b == c) {

                    alert("Triângulo Isósceles");

                } else {

                    alert("Triângulo Escaleno");

                }

            } else {

                alert("Os valores não formam um triângulo");

            }

        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Média com Recuperação</title>
</head>

<body>

    <h1>Calculadora de Média</h1>

    <label>Nota 1</label>
    <input id="nota1" type="number">

    <br><br>

    <label>Nota 2</label>
    <input id="nota2" type="number">

    <br><br>

    <button onclick="calcularMedia()">Calcular</button>

    <script>

        function calcularMedia() {

            let nota1 = Number(document.getElementById("nota1").value);

            let nota2 = Number(document.getElementById("nota2").value);

            let media = (nota1 + nota2) / 2;

            if (media >= 7) {

                alert("Aprovado com média " + media);

            } else {

                let recuperacao = Number(prompt("Digite a nota da recuperação"));

                media = (media + recuperacao) / 2;

                if (media >= 7) {

                    alert("Aprovado na recuperação com média " + media);

                } else {

                    alert("Reprovado com média " + media);

                }

            }

        }

    </script>

</body>

</html>
